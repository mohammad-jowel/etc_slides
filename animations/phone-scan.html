<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>phone-scan</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:transparent; font-family:Arial,Helvetica,sans-serif }
    .w { position:relative; width:720px; height:560px; background:#D8CCAE; border:6px solid #14130F; border-radius:28px; box-sizing:border-box; overflow:hidden }
    .sk { position:absolute; left:500px; top:190px; width:150px; height:150px; border-radius:50%; background:#FFD21F; border:6px solid #14130F; box-sizing:border-box }
    .sk svg { position:absolute; left:19px; top:19px }
    .rg { position:absolute; left:575px; top:265px; width:150px; height:150px; margin:-75px 0 0 -75px; border-radius:50%; border:6px solid #2B59D9; opacity:0; animation:rg 6s ease-out infinite }
    .rg.b { animation-delay:.4s }
    .rg.c { animation-delay:.8s }
    @keyframes rg{0%,19%{opacity:0;transform:scale(.5)}
    20% { opacity:.9; transform:scale(.5) }
    48% { opacity:0; transform:scale(2.6) }
    100% { opacity:0 }
    }
    .ph { position:absolute; left:290px; top:100px; width:200px; height:360px; border-radius:34px; background:#14130F; animation:ph 6s ease-in-out infinite }
    @keyframes ph{0%{transform:translateX(-340px) rotate(-14deg)}
    18%,74% { transform:none }
    92%,100% { transform:translateX(-340px) rotate(-14deg) }
    }
    .sc { position:absolute; left:10px; top:14px; width:180px; height:332px; border-radius:26px; background:#EFE7D3; overflow:hidden }
    .hd { position:absolute; left:0; top:0; width:180px; height:60px; background:#FFD21F }
    .r { position:absolute; left:0; top:0; width:180px; height:332px; opacity:0; animation:rs 6s ease-in-out infinite }
    @keyframes rs{0%,24%{opacity:0;transform:scale(.9)}
    30%,72% { opacity:1; transform:none }
    80%,100% { opacity:0 }
    }
    .ck { position:absolute; left:55px; top:90px }
    .tx { position:absolute; left:0; top:178px; width:180px; text-align:center; font:bold 28px Arial,sans-serif; color:#14130F }
    .ln { position:absolute; left:30px; height:14px; border-radius:7px; background:#14130F; opacity:.75 }
  </style>
</head>
<body>
  <div class="w">
  <div class="sk">
  <svg width="100" height="100" viewBox="0 0 100 100" fill="none" stroke="#14130F" stroke-width="9" stroke-linecap="round"><path d="M34 30c10 14 10 26 0 40"/><path d="M52 20c16 20 16 40 0 60"/><path d="M70 10c22 26 22 54 0 80"/></svg></div>
  <div class="rg"></div>
  <div class="rg b"></div>
  <div class="rg c"></div>
  <div class="ph"><div class="sc"><div class="hd"></div><div class="r">
  <svg class="ck" width="70" height="70" viewBox="0 0 70 70">
  <circle cx="35" cy="35" r="33" fill="#2B59D9"/><path d="M19 36l11 11 22-24" fill="none" stroke="#EFE7D3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="tx">Link opens</div><div class="ln" style="top:238px;width:120px"></div><div class="ln" style="top:266px;width:84px"></div></div></div></div></div>
</body>
</html>
